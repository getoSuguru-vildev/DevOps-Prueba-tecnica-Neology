name: ci

# PR a main: valida todo pero nunca publica.
# push a main o tag vX.Y.Z: valida y, si todo pasa, publica las imágenes en GHCR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "candidato/**"]
    tags: ["v*.*.*"]
  workflow_dispatch:

# Permisos mínimos por defecto. Solo el job de publicación pide más.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Herramientas en contenedor fijadas por digest (las mismas que se usan en local).
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  TRIVY_DB: public.ecr.aws/aquasecurity/trivy-db,mirror.gcr.io/aquasec/trivy-db
  HADOLINT_IMAGE: hadolint/hadolint:v2.14.0@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  backend:
    name: backend (pruebas y jar)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: mvn verify
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify

      - name: subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: frontend (npm ci y build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci falla si el lock no corresponde con package.json: instalación reproducible o nada.
      - name: npm ci
        run: npm ci --no-audit --no-fund

      # El proyecto no trae pruebas de frontend; el build AOT con strictTemplates es la validación de tipos.
      - name: build de producción
        run: npm run build

      - name: npm audit (dependencias de runtime)
        run: npm audit --omit=dev --audit-level=critical

  lint:
    name: lint (dockerfiles, scripts, workflow, compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint
        run: |
          for f in backend/Dockerfile frontend/Dockerfile; do
            echo "== $f"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$f"
          done

      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" scripts/*.sh

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: docker compose config
        run: docker compose config --quiet

  dependencias:
    name: seguridad (dependencias y secretos)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Aquí van el lock de npm y la búsqueda de secretos en el repo.
      # Las dependencias Java se escanean desde los jars dentro de la imagen (job images): es lo que de verdad
      # se despliega y no depende de Maven Central, que responde 429 si se le piden muchos pom seguidos.
      - name: trivy fs (reporte)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --db-repository "$TRIVY_DB" \
            --scanners vuln,secret --skip-files backend/pom.xml --severity HIGH,CRITICAL --exit-code 0 /src

      # Gate: truena con CRITICAL que ya tenga parche. Excepciones justificadas en .trivyignore.
      - name: trivy fs (gate CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" fs --db-repository "$TRIVY_DB" \
            --scanners vuln,secret --skip-files backend/pom.xml --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore /src

  iac:
    name: terraform (fmt, validate, plan, trivy config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      # fmt -check, init sin backend, validate y plan de dev y prod sin cuenta de AWS.
      - name: validar y plan offline
        run: ./infra/scripts/plan-offline.sh

      - name: trivy config (misconfig en terraform)
        run: |
          docker run --rm -v "$PWD/infra:/src:ro" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 /src

  images:
    name: imagen ${{ matrix.service }}
    needs: [backend, frontend, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: neology/parking-${{ matrix.service }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache de capas en GitHub Actions separada por servicio. Las bases van fijadas por digest
      # y las dependencias por lockfile, así que reusar capas no cambia el resultado.
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: trivy image (reporte)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --db-repository "$TRIVY_DB" --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"

      - name: trivy image (gate CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" "$TRIVY_IMAGE" image \
            --db-repository "$TRIVY_DB" --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /src/.trivyignore "$IMAGE"

      - name: sbom cyclonedx
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" "$TRIVY_IMAGE" image \
            --db-repository "$TRIVY_DB" --format cyclonedx --output "/out/sbom-${{ matrix.service }}.cdx.json" "$IMAGE"

      - name: exportar imagen
        run: docker save "$IMAGE" | gzip -1 > "image-${{ matrix.service }}.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 30

  e2e:
    name: stack completo (compose + smoke test)
    needs: [images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true

      - name: cargar imagenes
        run: for f in image-*.tar.gz; do gunzip -c "$f" | docker load; done

      # Se prueban exactamente las imágenes que se escanearon, sin reconstruir.
      - name: docker compose up
        run: docker compose up --detach --no-build --wait --wait-timeout 180

      - name: smoke test
        run: ./scripts/smoke-test.sh

      - name: logs si algo falló
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200

      - name: bajar stack
        if: always()
        run: docker compose down --volumes

  publish:
    name: publicar ${{ matrix.service }} en GHCR
    needs: [e2e, dependencias, iac]
    # Nunca desde pull requests: solo push a main o tags de versión.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}

      - name: cargar imagen probada
        run: gunzip -c "image-${{ matrix.service }}.tar.gz" | docker load

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/parking-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se publica la misma imagen que pasó escaneo y smoke test (build once, promote).
      - id: push
        name: tag y push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: neology/parking-${{ matrix.service }}:ci
        run: |
          for tag in $TAGS; do
            docker tag "$SOURCE" "$tag"
            docker push --quiet "$tag"
          done
          first_tag="$(echo "$TAGS" | head -n 1)"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$first_tag")"
          echo "ref=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### parking-${{ matrix.service }}"
            echo "Digest: \`$digest\`"
            echo "Tags:"
            for tag in $TAGS; do echo "- $tag"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Firma keyless con el token OIDC del workflow: se puede verificar quién y desde qué commit se publicó.
      - name: firmar imagen
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"
