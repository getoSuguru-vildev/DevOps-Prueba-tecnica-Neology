server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: parking-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:parking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  # La consola H2 permite ejecutar SQL (y en versiones vulnerables, código) desde el navegador.
  # Apagada por defecto; solo se prende con el perfil local (mvn spring-boot:run lo activa).
  h2:
    console:
      enabled: false
      path: /h2-console
  # El esquema lo crea Flyway (db/migration). Hibernate solo valida que coincida con las entidades.
  # baseline-on-migrate: una base que ya tenía las tablas creadas por Hibernate se toma como versión 1.
  flyway:
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        # prometheus no se publica hacia internet: nginx y el ALB solo dejan pasar /actuator/health.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # liveness no depende de la base (si la base cae, reiniciar la app no ayuda);
        # readiness sí, para que el balanceador deje de mandar tráfico a una instancia sin base.
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets para calcular percentiles en Prometheus y medir el SLO de latencia (300 ms).
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

logging:
  pattern:
    # En formato texto también se ve el requestId de cada línea.
    level: "%5p [%X{requestId:-}]"

info:
  app:
    name: Parking API
    version: 1.0.0

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200}

