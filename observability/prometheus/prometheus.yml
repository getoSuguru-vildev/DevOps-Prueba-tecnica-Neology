# Prometheus local (perfil "observability" de docker compose).
# En AWS lo equivalente es Amazon Managed Prometheus o CloudWatch con las alarmas de infra/modules/observability.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: parking-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
