# Plantilla procesada por envsubst al arrancar (20-envsubst-on-templates.sh de la imagen oficial).
# Variables: BACKEND_UPSTREAM (host:puerto del backend) y NGINX_LOCAL_RESOLVERS (lo llena la imagen).

# Id de correlación: se respeta el X-Request-ID que manda el navegador o se genera uno.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"request_id":"$correlation_id",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;

    # El backend se resuelve en cada petición (valid=10s): si su contenedor se reinicia y cambia de IP
    # nginx no se queda con la IP vieja, y tampoco falla al arrancar si el backend aún no existe.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend_upstream http://${BACKEND_UPSTREAM};

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # El hash permite el onload que Angular usa para cargar el CSS crítico (this.media='all').
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Request-ID $correlation_id always;

    # Health check del propio contenedor, no depende del backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /neo/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 1m;
    }

    # Del actuator solo se publica el health. Métricas y demás endpoints quedan internos.
    location = /actuator/health {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $correlation_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /actuator/ {
        return 404;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
