# Stack local: PostgreSQL + API Spring Boot + SPA Angular en nginx.
# Funciona sin .env (valores por defecto solo para desarrollo local). Para cambiarlos: cp .env.example .env

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  database:
    <<: *hardening
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    # UID del usuario postgres en la imagen alpine. Así no hace falta root ni capabilities para chown.
    user: "70:70"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parking}
      POSTGRES_USER: ${POSTGRES_USER:-parking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:mode=1777
      - /tmp:mode=1777
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    <<: *hardening
    build:
      context: ./backend
      args:
        VERSION: ${IMAGE_TAG:-local}
    image: neology/parking-backend:${IMAGE_TAG:-local}
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-parking}
      DB_USERNAME: ${POSTGRES_USER:-parking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-4200}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    tmpfs:
      - /tmp:mode=1777
    networks: [edge, data]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 30s
    # server.shutdown=graceful espera hasta 20s a que terminen las peticiones en curso.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        VERSION: ${IMAGE_TAG:-local}
    image: neology/parking-frontend:${IMAGE_TAG:-local}
    environment:
      BACKEND_UPSTREAM: backend:8080
    ports:
      - "${FRONTEND_PORT:-4200}:8080"
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
      - /etc/nginx/conf.d:mode=1777
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # --- Perfil opcional: docker compose --profile observability up ---
  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    tmpfs:
      - /prometheus:mode=1777
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 6

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_local_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/parking-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:mode=1777
      - /var/log/grafana:mode=1777
      - /tmp:mode=1777
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks: [edge]
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  # edge: tráfico desde el host hacia frontend y backend.
  edge: {}
  # data: red interna sin salida, solo backend y base de datos. PostgreSQL no publica puertos.
  data:
    internal: true

volumes:
  postgres_data:
